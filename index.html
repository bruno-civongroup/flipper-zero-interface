<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Bruno Malnovic</title>
    <meta name="description" content="Tools and experiments by Bruno Malnovic.">
    <link rel="canonical" href="https://projects.brunomalnovic.com/">
    <meta property="og:title" content="Projects — Bruno Malnovic">
    <meta property="og:description" content="Tools and experiments by Bruno Malnovic.">
    <meta property="og:url" content="https://projects.brunomalnovic.com/">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 30%;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(224, 153, 0, 0.06) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 560px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #d4a030;
            margin-bottom: 0.8rem;
        }

        .rule {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4a030, transparent);
            margin: 0 auto 1rem;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 300;
            color: #7a7a8a;
            margin-bottom: 2.8rem;
            letter-spacing: 0.03em;
        }

        .project-card {
            display: block;
            padding: 1.6rem 1.8rem;
            border: 1px solid rgba(212, 168, 48, 0.2);
            border-radius: 6px;
            background: rgba(212, 168, 48, 0.03);
            text-decoration: none;
            color: inherit;
            text-align: left;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 2.8rem;
        }

        .project-card:hover {
            background: rgba(212, 168, 48, 0.08);
            border-color: rgba(212, 168, 48, 0.45);
            box-shadow: 0 0 24px rgba(212, 168, 48, 0.06);
            transform: translateY(-2px);
        }

        .project-card .arrow {
            position: absolute;
            right: 1.6rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #d4a030;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .project-card:hover .arrow {
            opacity: 1;
            transform: translateY(-50%) translateX(3px);
        }

        .project-card .title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.15rem;
            font-weight: 500;
            color: #e0e0e0;
            margin-bottom: 0.5rem;
            letter-spacing: 0.04em;
        }

        .project-card .desc {
            font-size: 0.85rem;
            font-weight: 300;
            color: #7a7a8a;
            line-height: 1.6;
            padding-right: 2rem;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            margin-bottom: 1.5rem;
        }

        .footer {
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 0.05em;
        }

        .footer a {
            color: #555;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #d4a030;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .project-card { padding: 1.2rem 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Projects</h1>
        <div class="rule"></div>
        <p class="subtitle">Tools and experiments</p>

        <a href="/flipper/" class="project-card">
            <div class="title">Flipper Zero Interface</div>
            <div class="desc">Web-based serial terminal and file manager for Flipper Zero. Connect via WebSerial to browse files, run commands, and manage your device.</div>
            <span class="arrow">&rsaquo;</span>
        </a>

        <div class="divider"></div>
        <p class="footer"><a href="https://brunomalnovic.com">brunomalnovic.com</a></p>
    </div>
</body>
</html>
